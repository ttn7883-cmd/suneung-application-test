<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수능 임시 원서접수 판별 테스트</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f4f6f8;color:#222}
.container{max-width:720px;margin:auto;padding:20px}
h1{font-size:24px;margin:8px 0 6px}
.subtitle{color:#666;font-size:14px;line-height:1.5;margin-bottom:20px}
.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 3px 14px rgba(0,0,0,.08)}
.step{font-size:13px;color:#666;margin-bottom:8px}
.question{font-size:20px;font-weight:700;line-height:1.45;margin-bottom:18px}
button.option,button.action{width:100%;padding:16px 14px;margin:7px 0;border:1px solid #d8dde3;border-radius:12px;background:#fff;font-size:16px;text-align:left}
button.option:active,button.action:active{background:#eef2f6}
.result{white-space:pre-line;line-height:1.7;font-size:15px}
.notice{padding:14px;border-radius:12px;background:#fff4d6;margin:14px 0;line-height:1.6}
.small{font-size:13px;color:#777;margin-top:14px}
</style>
</head>
<body>
<div class="container">
  <h1>수능 임시 원서접수 판별</h1>
  <div class="subtitle">휴대폰 테스트용 1차 버전 · 현재 정리된 19개 경우를 기준으로 제작</div>
  <div id="app"></div>
</div>

<script>
const app=document.getElementById("app");

const state={answers:{}};

function card(step, question, options){
  app.innerHTML=`<div class="card">
    <div class="step">${step}단계</div>
    <div class="question">${question}</div>
    ${options.map(o=>`<button class="option" onclick="${o.fn}">${o.label}</button>`).join("")}
  </div>`;
}

function start(){
  state.answers={};
  card(1,"응시자 구분을 선택하세요.",[
    {label:"고등학교 졸업예정자(재학생)",fn:"choose('type','재학생'); step2_student();"},
    {label:"고등학교 졸업자(졸업생)",fn:"choose('type','졸업생'); step2_graduate();"}
  ]);
}

function choose(k,v){state.answers[k]=v;}

function step2_student(){
  card(2,"현재 주민등록등본상 주소지가 여수시인가요?",[
    {label:"O — 여수시",fn:"choose('addr','O'); step3_student();"},
    {label:"X — 여수시가 아님",fn:"choose('addr','X'); result('재학 중인 학교에 문의 후 접수\\n(여수교육지원청에서는 접수 불가)');"}
  ]);
}

function step3_student(){
  card(3,"시험편의제공대상자인가요?",[
    {label:"O",fn:"choose('special','O'); step4_student_special();"},
    {label:"X",fn:"choose('special','X'); result('재학 중인 학교에서만 접수 가능');"}
  ]);
}

function step4_student_special(){
  card(4,"응시자 본인인가요?",[
    {label:"O — 본인",fn:"choose('self','O'); step5_online_student_self();"},
    {label:"X — 대리접수",fn:"choose('self','X'); noticeAndStep5_student_agent();"}
  ]);
}

function noticeAndStep5_student_agent(){
  app.innerHTML=`<div class="card">
    <div class="step">안내</div>
    <div class="notice"><b>시험편의제공대상자 대리접수</b></div>
    <button class="action" onclick="step5_online_student_agent()">계속</button>
  </div>`;
}

function step5_online_student_self(){
  card(5,"온라인 사전입력을 완료했나요?",[
    {label:"O — 완료",fn:"choose('online','O'); result(case1());"},
    {label:"X — 미완료",fn:"choose('online','X'); result(case2());"}
  ]);
}

function step5_online_student_agent(){
  card(5,"온라인 사전입력을 완료했나요?",[
    {label:"O — 완료",fn:"choose('online','O'); result(case3());"},
    {label:"X — 미완료",fn:"choose('online','X'); result(case4());"}
  ]);
}

function step2_graduate(){
  card(2,"여수 지역 고등학교를 졸업했나요?",[
    {label:"O",fn:"choose('localgrad','O'); step3_graduate();"},
    {label:"X",fn:"choose('localgrad','X'); step3_graduate_nonlocal();"}
  ]);
}

function step3_graduate(){
  card(3,"현재 주민등록등본상 주소지가 여수시인가요?",[
    {label:"O",fn:"choose('addr','O'); step4_graduate_local_yes();"},
    {label:"X",fn:"choose('addr','X'); step4_graduate_local_no();"}
  ]);
}

function step4_graduate_local_yes(){
  card(4,"시험편의제공대상자인가요?",[
    {label:"O",fn:"choose('special','O'); step5_graduate_local_yes_special();"},
    {label:"X",fn:"choose('special','X'); step5_graduate_local_yes_nonspecial();"}
  ]);
}

function step5_graduate_local_yes_special(){
  card(5,"응시자 본인인가요?",[
    {label:"O — 본인",fn:"choose('self','O'); step6_online_graduate_special_self();"},
    {label:"X — 대리접수",fn:"choose('self','X'); noticeAndStep6_graduate_special_agent();"}
  ]);
}

function step6_online_graduate_special_self(){
  card(6,"온라인 사전입력을 완료했나요?",[
    {label:"O — 완료",fn:"result(case7());"},
    {label:"X — 미완료",fn:"result(case12());"}
  ]);
}

function noticeAndStep6_graduate_special_agent(){
  app.innerHTML=`<div class="card">
    <div class="step">안내</div>
    <div class="notice"><b>시험편의제공대상자 대리접수</b></div>
    <button class="action" onclick="step6_graduate_special_agent()">계속</button>
  </div>`;
}
function step6_graduate_special_agent(){
  card(6,"온라인 사전입력을 완료했나요?",[
    {label:"O — 완료",fn:"result(case3());"},
    {label:"X — 미완료",fn:"result(case4());"}
  ]);
}

function step5_graduate_local_yes_nonspecial(){
  card(5,"응시자 본인인가요?",[
    {label:"O — 본인",fn:"choose('self','O'); step6_online_graduate_nonspecial_self();"},
    {label:"X — 대리접수",fn:"choose('self','X'); step6_agent_type();"}
  ]);
}
function step6_online_graduate_nonspecial_self(){
  card(6,"온라인 사전입력을 완료했나요?",[
    {label:"O — 완료",fn:"result(case15());"},
    {label:"X — 미완료",fn:"result(case16());"}
  ]);
}

function step4_graduate_local_no(){
  card(4,"시험편의제공대상자인가요?",[
    {label:"O",fn:"choose('special','O'); result('내용 확인 필요\\n\\n※ 현재 9번째 경우의 세부 절차가 미확정입니다.');"},
    {label:"X",fn:"result('졸업한 고등학교에서 접수 또는 현재 주민등록등본상 주소지를 관할하는 교육지원청에 접수장소 문의 후 접수');"}
  ]);
}

function step3_graduate_nonlocal(){
  card(3,"현재 주민등록등본상 주소지가 여수시인가요?",[
    {label:"O",fn:"choose('addr','O'); step4_graduate_nonlocal_yes();"},
    {label:"X",fn:"result('졸업한 고등학교에서 접수 또는 현재 주민등록등본상 주소지를 관할하는 교육지원청에 접수장소 문의 후 접수');"}
  ]);
}
function step4_graduate_nonlocal_yes(){
  card(4,"시험편의제공대상자인가요?",[
    {label:"O",fn:"choose('special','O'); step5_graduate_nonlocal_special();"},
    {label:"X",fn:"result('졸업한 고등학교에서 접수 또는 현재 주민등록등본상 주소지를 관할하는 교육지원청에 접수장소 문의 후 접수');"}
  ]);
}
function step5_graduate_nonlocal_special(){
  card(5,"응시자 본인인가요?",[
    {label:"O — 본인",fn:"choose('self','O'); step6_online_nonlocal_special_self();"},
    {label:"X — 대리접수",fn:"choose('self','X'); noticeAndStep6_nonlocal_agent();"}
  ]);
}
function step6_online_nonlocal_special_self(){
  card(6,"온라인 사전입력을 완료했나요?",[
    {label:"O — 완료",fn:"result(case11());"},
    {label:"X — 미완료",fn:"result(case12());"}
  ]);
}
function noticeAndStep6_nonlocal_agent(){
  app.innerHTML=`<div class="card">
    <div class="step">안내</div>
    <div class="notice"><b>시험편의제공대상자 대리접수</b></div>
    <button class="action" onclick="step6_nonlocal_agent()">계속</button>
  </div>`;
}
function step6_nonlocal_agent(){
  card(6,"온라인 사전입력을 완료했나요?",[
    {label:"O — 완료",fn:"result(case3());"},
    {label:"X — 미완료",fn:"result(case4());"}
  ]);
}

function step6_agent_type(){
  card(6,"대리접수 유형을 선택하세요.",[
    {label:"군복무자",fn:"choose('agentType','군복무자'); step7_agent_type();"},
    {label:"장기입원자",fn:"choose('agentType','장기입원자'); step7_agent_type();"},
    {label:"수형자 등",fn:"choose('agentType','수형자 등'); step7_agent_type();"}
  ]);
}
function step7_agent_type(){
  card(7,"온라인 사전입력을 완료했나요?",[
    {label:"O — 완료",fn:"result(case17());"},
    {label:"X — 미완료",fn:"result(case18());"}
  ]);
}

function case1(){return `제출 서류 확인 및 복사: 응시자 본인 신분증, 장애인증명서, 종합병원장 진단서, 학교장 확인서\n\n시스템 정보 조회 후 접수확인증 출력\n\n접수확인증 내용 확인 후 항목마다 체크\n\n서류 발급: 접수확인증, 영수증\n실시요강 배부\n유의사항 안내(수험표 샘플 활용)`}
function case2(){return `제출 서류 확인 및 복사: 응시자 본인 신분증, 여권용 규격 사진 2매, 장애인증명서, 종합병원장 진단서, 학교장 확인서\n\n현장에서 응시원서 작성(실시요강 참고)\n\n시스템에 정보 입력 후 접수확인증 출력\n\n접수확인증 내용 확인 후 항목마다 체크\n\n응시 수수료 결제\n\n서류 발급: 접수확인증, 결제 영수증\n실시요강 배부\n유의사항 안내(수험표 샘플 활용)`}
function case3(){return `대리접수 제출 서류 확인 및 복사: 대리접수자 신분증, 가족관계증명서 또는 주민등록등본(응시자와 대리접수자의 관계가 증명 가능해야 함), 장애인증명서, 종합병원장 진단서, 학교장 확인서\n\n대리접수 서약서 작성, 시스템 정보 조회 후 접수확인증 출력\n\n접수확인증 내용 확인 후 항목마다 체크\n\n서류 발급: 접수확인증, 영수증\n실시요강 배부\n유의사항 안내(수험표 샘플 활용)`}
function case4(){return `대리접수 제출 서류 확인 및 복사: 대리접수자 신분증, 가족관계증명서 또는 주민등록등본(응시자와 대리접수자의 관계가 증명 가능해야 함), 장애인증명서, 종합병원장 진단서, 학교장 확인서, 여권용 규격 사진 2매\n\n대리접수 서약서 작성, 현장에서 응시원서 작성(실시요강 참고)\n\n시스템에 정보 입력 후 접수확인증 출력\n\n접수확인증 내용 확인 후 항목마다 체크\n\n응시 수수료 결제\n\n서류 발급: 접수확인증, 영수증\n실시요강 배부\n유의사항 안내(수험표 샘플 활용)`}
function case7(){return `졸업생의 온라인 사전입력 완료 + 시험편의제공대상자 + 본인 접수 흐름\n\n※ 현재 정리에서는 첫 번째 경우의 후속 절차를 기준으로 연결했습니다.\n\n${case1()}`}
function case11(){return case7()}
function case12(){return case2()}
function case15(){return `졸업생 + 여수 지역 고등학교 졸업 X + 주소지 여수시 O + 시험편의제공대상자 X + 본인 O + 온라인 사전입력 O\n\n※ 졸업생 추가 단계는 추후 확인 필요\n\n${case1()}`}
function case16(){return `졸업생 + 여수 지역 고등학교 졸업 X + 주소지 여수시 O + 시험편의제공대상자 X + 본인 O + 온라인 사전입력 X\n\n※ 졸업생 추가 단계는 추후 확인 필요\n\n${case2()}`}
function case17(){return `대리접수 유형: ${state.answers.agentType || "확인 필요"}\n\n대리접수 제출 서류 확인 및 복사: 대리접수자 신분증, 가족관계증명서 또는 주민등록등본(응시자와 대리접수자의 관계가 증명 가능해야 함) + 유형별 추가 서류(내용 추가 예정)\n\n대리접수 서약서 작성, 시스템 정보 조회 후 접수확인증 출력\n\n접수확인증 내용 확인 후 항목마다 체크\n\n서류 발급: 접수확인증, 영수증\n실시요강 배부\n유의사항 안내(수험표 샘플 활용)`}
function case18(){return `대리접수 유형: ${state.answers.agentType || "확인 필요"}\n\n대리접수 제출 서류 확인 및 복사: 대리접수자 신분증, 가족관계증명서 또는 주민등록등본(응시자와 대리접수자의 관계가 증명 가능해야 함) + 유형별 추가 서류(내용 추가 예정), 여권용 규격 사진 2매\n\n대리접수 서약서 작성, 현장에서 응시원서 작성(실시요강 참고)\n\n시스템에 정보 입력 후 접수확인증 출력\n\n접수확인증 내용 확인 후 항목마다 체크\n\n응시 수수료 결제\n\n서류 발급: 접수확인증, 영수증\n실시요강 배부\n유의사항 안내(수험표 샘플 활용)`}

function result(text){
  app.innerHTML=`<div class="card">
    <div class="step">판별 결과</div>
    <div class="result">${text}</div>
    <button class="action" onclick="start()">처음부터 다시</button>
    <div class="small">※ 1차 테스트 버전입니다. 현재 확정된 내용만 반영했으며, 9번째 경우와 일부 졸업생 추가 절차는 추후 보완해야 합니다.</div>
  </div>`;
}
start();
</script>
</body>
</html>
